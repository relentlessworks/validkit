name: Tag & Release

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '*.md', 'LICENSE']

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      created: ${{ steps.create_tag.outputs.created }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read version
        id: version
        run: echo "version=v$(cat VERSION)" >> $GITHUB_OUTPUT
      - name: Check if tag exists
        id: check_tag
        run: |
          if git rev-parse ${{ steps.version.outputs.version }} >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      - name: Create tag
        id: create_tag
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.version.outputs.version }}
          git push origin ${{ steps.version.outputs.version }}
          echo "created=true" >> $GITHUB_OUTPUT

  build:
    runs-on: ubuntu-latest
    needs: tag
    if: needs.tag.outputs.created == 'true'
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -trimpath -ldflags "-s -w" -o validkit-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/validkit
      - name: Package
        run: |
          tar -czf validkit-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz validkit-${{ matrix.goos }}-${{ matrix.goarch }}
      - uses: actions/upload-artifact@v4
        with:
          name: validkit-${{ matrix.goos }}-${{ matrix.goarch }}
          path: validkit-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz

  publish:
    runs-on: ubuntu-latest
    needs: [tag, build]
    if: needs.tag.outputs.created == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge: true
      - name: Generate checksums
        run: |
          cd artifacts
          find . -name '*.tar.gz' -exec sha256sum {} + > checksums.txt
          cat checksums.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${{ needs.tag.outputs.version }}
          # Collect all tar.gz files and checksums
          FILES=$(find artifacts -name '*.tar.gz' -o -name 'checksums.txt' | sort)
          gh release create "$VERSION" \
            --title "Release $VERSION" \
            --notes "Auto-generated release for $VERSION" \
            $FILES
